services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: siteboutique_app
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        depends_on:
            - mysql

    nginx:
        image: nginx:alpine
        container_name: siteboutique_nginx
        ports:
            - "8082:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: siteboutique_mysql
        restart: unless-stopped
        ports:
            - "3309:3306"
        environment:
            MYSQL_DATABASE: siteboutique
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
            MYSQL_USER: site_user
        volumes:
            - siteboutique_mysql_data:/var/lib/mysql

volumes:
    siteboutique_mysql_data:
