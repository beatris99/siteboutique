services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: sitego_app
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        depends_on:
            - mysql

    nginx:
        image: nginx:alpine
        container_name: sitego_nginx
        ports:
            - "8082:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    node:
        image: node:22-alpine
        container_name: sitego_node
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        ports:
            - "5173:5173"

    mysql:
        image: mysql:8.0
        container_name: sitego_mysql
        restart: unless-stopped
        ports:
            - "3309:3306"
        environment:
            MYSQL_DATABASE: sitego
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
            MYSQL_USER: site_user
        volumes:
            - sitego_mysql_data:/var/lib/mysql

volumes:
    sitego_mysql_data:
